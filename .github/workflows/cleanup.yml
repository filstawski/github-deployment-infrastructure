name: GDI scheduled cleanup

# Runs independently of Claude or any developer machine (spec section 16).
# Install this workflow in the SOURCE project repository (the one that
# contains .github/deployment.yml), not in the disposable deployment
# repositories themselves.

on:
  schedule:
    # Default: every 3 hours. Adjust to taste; the effective policy is
    # still governed by cleanup.grace_period / cleanup.maximum_ttl in
    # .github/deployment.yml.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install outside the workspace. This repo's package.json exposes a
      # `gdi` bin that imports gitignored dist/, so any npx/npm-exec form
      # (including `--package`) still resolves the local unbuilt binary —
      # or, on the Node 20 npm that Actions ships, fails with `gdi: not found`.
      - name: Install github-deployment-infrastructure
        run: npm install --prefix "$RUNNER_TEMP/gdi-cli" github-deployment-infrastructure

      - name: Run cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GDI_GITHUB_TOKEN }}
        run: node "$RUNNER_TEMP/gdi-cli/node_modules/github-deployment-infrastructure/bin/gdi.js" cleanup
